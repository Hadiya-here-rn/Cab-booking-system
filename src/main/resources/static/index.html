<!DOCTYPE html>
<html>
<head>
    <title>Cab Booking System</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f1e6; /* beige */
        }

        .header {
            background: #0a1f44; /* navy */
            color: #f5f1e6;
            padding: 18px 30px;
            font-size: 22px;
            font-weight: 600;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        h3 {
            color: #0a1f44;
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        .primary {
            background: #0a1f44;
            color: #f5f1e6;
        }

        .update {
            background: #d6c9a8; /* beige dark */
        }

        .delete {
            background: #b23b3b;
            color: white;
        }

        .complete {
            background: #3a6ea5;
            color: white;
        }

        .booking {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
        }

        .booked {
            background: #0a1f44;
        }

        .completed {
            background: #3a6ea5;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>

<div class="header">🚖 Cab Booking System</div>

<div class="container">

    <div class="card">
        <h3>Book a Ride</h3>
        <input id="name" placeholder="Customer Name">
        <input id="location" placeholder="Pickup Location">
        <button class="primary" onclick="bookCab()">Book Ride</button>
    </div>

    <div class="card">
        <div class="top-bar">
            <h3>Bookings</h3>
            <input id="search" placeholder="Search..." onkeyup="searchBookings()">
        </div>

        <h4>Total: <span id="count"></span></h4>
        <div id="list"></div>
    </div>

</div>

<script>
function bookCab() {
    const name = document.getElementById("name").value;
    const location = document.getElementById("location").value;

    fetch('/book', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, location})
    }).then(() => loadBookings());
}

function deleteBooking(id) {
    fetch(`/delete/${id}`, { method: 'DELETE' })
        .then(() => loadBookings());
}

function updateBooking(id) {
    const name = prompt("New Name:");
    const location = prompt("New Location:");

    fetch(`/update/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, location})
    }).then(() => loadBookings());
}

function completeRide(id) {
    fetch(`/complete/${id}`, { method: 'PUT' })
        .then(() => loadBookings());
}

function searchBookings() {
    const value = document.getElementById("search").value.toLowerCase();
    const items = document.querySelectorAll(".booking");

    items.forEach(item => {
        item.style.display = item.innerText.toLowerCase().includes(value) ? "block" : "none";
    });
}

function loadBookings() {
    fetch('/bookings')
        .then(res => res.json())
        .then(data => {
            let list = document.getElementById("list");
            list.innerHTML = "";
            document.getElementById("count").innerText = data.length;

            data.forEach((b, i) => {
                list.innerHTML += `
                    <div class="booking">
                        <b>${b.name}</b> - ${b.location}
                        <br>
                        <small>${b.time || ""}</small>
                        <br>
                        <span class="status ${b.status === 'Completed' ? 'completed' : 'booked'}">
                            ${b.status || "Booked"}
                        </span>
                        <br><br>
                        <button class="update" onclick="updateBooking(${i})">Update</button>
                        <button class="delete" onclick="deleteBooking(${i})">Delete</button>
                        <button class="complete" onclick="completeRide(${i})">Complete</button>
                    </div>
                `;
            });
        });
}

loadBookings();
</script>

</body>
</html>
